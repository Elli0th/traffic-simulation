<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tangible Table · Stream</title>
    <style>
      :root {
        color-scheme: dark;
        --line: rgba(255, 255, 255, 0.12);
        --dim: #8a94a3;
        --accent: #5ad1ff;
        --bad: #ff6a5e;
        --good: #39e6b0;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        background: #000;
        color: #e9ecef;
        font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', sans-serif;
        overflow: hidden;
      }
      header {
        flex: none;
        display: flex;
        gap: 10px;
        align-items: center;
        height: 48px;
        padding: 0 14px;
        background: #0b0d11;
        border-bottom: 1px solid var(--line);
      }
      header h1 {
        margin: 0 8px 0 0;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--dim);
      }
      button {
        padding: 6px 12px;
        color: inherit;
        background: #1c222b;
        border: 1px solid var(--line);
        border-radius: 6px;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
      }
      button.on {
        color: #06222e;
        background: var(--accent);
        border-color: var(--accent);
        font-weight: 600;
      }
      #status {
        margin-left: auto;
        color: var(--dim);
        font-variant-numeric: tabular-nums;
      }
      #status.live {
        color: var(--good);
      }
      #status.bad {
        color: var(--bad);
      }
      main {
        flex: 1;
        min-height: 0;
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: center;
      }
      /* The pictures that are streamed, each the shape of its display. The page inside is laid out at a
         fixed size and scaled to fit, so it looks the same whatever the size of this window. */
      .stage {
        position: relative;
        overflow: hidden;
        background: #000;
      }
      .stage iframe {
        position: absolute;
        top: 0;
        left: 0;
        border: 0;
        transform-origin: 0 0;
      }
      #stage {
        aspect-ratio: 1.6;
        width: min(66vw, (100vh - 48px) * 1.6);
      }
      #tvs {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #tvs .stage {
        aspect-ratio: 16 / 9;
        width: min(calc(34vw - 16px), (100vh - 56px) / 2 * 16 / 9);
      }
      body.table-only #tvs {
        display: none;
      }
      body.table-only #stage {
        width: min(100vw, (100vh - 48px) * 1.6);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Stream</h1>
      <button data-mode="traffic">Traffic</button>
      <button data-mode="game">Outbreak game</button>
      <span style="width: 12px"></span>
      <button id="start">Start streaming</button>
      <button id="stop" hidden>Stop</button>
      <span id="status">Not streaming. Only what is chosen on the left is running.</span>
    </header>
    <main>
      <div id="stage" class="stage" data-display="projector"><iframe id="view" title="The table"></iframe></div>
      <div id="tvs">
        <div class="stage" data-display="tv-1"><iframe title="The left TV"></iframe></div>
        <div class="stage" data-display="tv-2"><iframe title="The right TV"></iframe></div>
      </div>
    </main>
    <script type="module" src="/src/room/stream.js"></script>
  </body>
</html>
