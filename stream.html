<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tangible Table · Stream</title>
    <style>
      :root {
        color-scheme: dark;
        --line: rgba(255, 255, 255, 0.12);
        --dim: #8a94a3;
        --accent: #5ad1ff;
        --bad: #ff6a5e;
        --good: #39e6b0;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        background: #000;
        color: #e9ecef;
        font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', sans-serif;
        overflow: hidden;
      }
      header {
        flex: none;
        display: flex;
        gap: 10px;
        align-items: center;
        height: 48px;
        padding: 0 14px;
        background: #0b0d11;
        border-bottom: 1px solid var(--line);
      }
      header h1 {
        margin: 0 8px 0 0;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--dim);
      }
      button {
        padding: 6px 12px;
        color: inherit;
        background: #1c222b;
        border: 1px solid var(--line);
        border-radius: 6px;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
      }
      button.on {
        color: #06222e;
        background: var(--accent);
        border-color: var(--accent);
        font-weight: 600;
      }
      #status {
        margin-left: auto;
        color: var(--dim);
        font-variant-numeric: tabular-nums;
      }
      #status.live {
        color: var(--good);
      }
      #status.bad {
        color: var(--bad);
      }
      main {
        flex: 1;
        min-height: 0;
        display: grid;
        place-items: center;
      }
      /* The picture that is streamed: the shape of the display, as large as the window allows. */
      #stage {
        aspect-ratio: var(--shape, 1.6);
        width: min(100vw, (100vh - 48px) * var(--shape, 1.6));
        background: #000;
      }
      #view {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
      /* A browser that cannot crop the stream to the picture streams the whole window: no bar then. */
      body.bare header {
        display: none;
      }
      body.bare #stage {
        width: min(100vw, 100vh * var(--shape, 1.6));
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Stream</h1>
      <button data-mode="traffic">Traffic</button>
      <button data-mode="game">Outbreak game</button>
      <span style="width: 12px"></span>
      <button id="start">Start streaming</button>
      <button id="stop" hidden>Stop</button>
      <span id="status">Not streaming. Only what is chosen on the left is running.</span>
    </header>
    <main>
      <div id="stage"><iframe id="view" title="The table"></iframe></div>
    </main>
    <script type="module" src="/src/room/stream.js"></script>
  </body>
</html>
