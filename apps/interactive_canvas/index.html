<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aixia Hackathon Interactive Canvas</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #030712;
      color: #00f0ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(10, 15, 30, 0.75);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 13px;
      backdrop-filter: blur(6px);
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .hud-row { margin-bottom: 4px; }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(0, 240, 255, 0.15);
      color: #38bdf8;
      font-weight: bold;
    }
    .key-hint {
      color: #94a3b8;
      font-size: 11px;
      margin-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 6px;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="hud-row"><strong>AIXIA ROOM INTERACTIVE SURFACE</strong></div>
    <div class="hud-row">Status: <span id="status" class="badge">Connecting to Lidar...</span></div>
    <div class="hud-row">Lidar Points: <span id="ptCount">0</span> | FPS: <span id="fps">0</span></div>
    <div class="hud-row">Cal: <span id="calInfo">X: 960, Y: 100, S: 0.65, R: 0&deg;</span></div>
    <div class="key-hint">
      Arrows: Move &bull; +/-: Scale &bull; R: Rotate &bull; M: Flip &bull; C: Hide HUD
    </div>
  </div>

  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");
    const ptCountEl = document.getElementById("ptCount");
    const fpsEl = document.getElementById("fps");
    const calInfoEl = document.getElementById("calInfo");
    const hudEl = document.getElementById("hud");

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    // Calibration settings (tunable live via keyboard)
    let cal = {
      x: width / 2,
      y: 60,
      scale: 0.65,
      rot: 0,
      flip: 1
    };

    function updateCalHud() {
      calInfoEl.textContent = `X: ${cal.x.toFixed(0)}, Y: ${cal.y.toFixed(0)}, S: ${cal.scale.toFixed(2)}, R: ${cal.rot}&deg;, F: ${cal.flip}`;
    }
    updateCalHud();

    // Keyboard shortcuts for live calibration
    window.addEventListener("keydown", (e) => {
      let changed = true;
      if (e.key === "ArrowLeft") cal.x -= 5;
      else if (e.key === "ArrowRight") cal.x += 5;
      else if (e.key === "ArrowUp") cal.y -= 5;
      else if (e.key === "ArrowDown") cal.y += 5;
      else if (e.key === "+" || e.key === "=") cal.scale *= 1.02;
      else if (e.key === "-" || e.key === "_") cal.scale /= 1.02;
      else if (e.key === "r" || e.key === "R") cal.rot = (cal.rot + 1) % 360;
      else if (e.key === "m" || e.key === "M") cal.flip *= -1;
      else if (e.key === "c" || e.key === "C") {
        hudEl.style.opacity = hudEl.style.opacity === "0" ? "1" : "0";
        changed = false;
      } else {
        changed = false;
      }
      if (changed) updateCalHud();
    });

    // Particle ripple system for touches
    const particles = [];
    class Ripple {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.r = 8;
        this.alpha = 1.0;
        this.speed = 3.5;
      }
      update() {
        this.r += this.speed;
        this.alpha -= 0.04;
      }
      draw(g) {
        g.save();
        g.beginPath();
        g.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        g.strokeStyle = `rgba(0, 240, 255, ${Math.max(0, this.alpha)})`;
        g.lineWidth = 2.5;
        g.stroke();

        g.beginPath();
        g.arc(this.x, this.y, 4, 0, Math.PI * 2);
        g.fillStyle = `rgba(255, 255, 255, ${Math.max(0, this.alpha)})`;
        g.fill();
        g.restore();
      }
    }

    let latestPoints = [];
    let frameCount = 0;
    let lastFpsTime = performance.now();

    // WebSocket connection to Lidar
    const lidarHost = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
      ? "192.168.42.24"
      : "192.168.42.24";
    const wsUrl = `ws://${lidarHost}/scan`;

    function connectWs() {
      const ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        statusEl.textContent = "Lidar Online (10 RPS)";
        statusEl.style.background = "rgba(34, 197, 94, 0.2)";
        statusEl.style.color = "#4ade80";
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          latestPoints = data.points || [];
          ptCountEl.textContent = latestPoints.length;

          // Spawn ripples for prominent touches (filtered table points)
          for (let i = 0; i < latestPoints.length; i += 8) {
            const p = latestPoints[i];
            if (!p.distance || p.distance < 120 || p.distance > 1400 || p.quality < 15) continue;
            const a = (p.angle + cal.rot) * (Math.PI / 180);
            const x = cal.x + cal.flip * Math.sin(a) * p.distance * cal.scale;
            const y = cal.y + Math.cos(a) * p.distance * cal.scale;

            if (x >= 50 && x <= width - 50 && y >= 50 && y <= height - 50) {
              if (Math.random() < 0.15 && particles.length < 30) {
                particles.push(new Ripple(x, y));
              }
            }
          }
        } catch (err) {
          console.error(err);
        }
      };

      ws.onerror = () => {
        statusEl.textContent = "Connection Error";
        statusEl.style.color = "#f87171";
      };

      ws.onclose = () => {
        statusEl.textContent = "Disconnected - Retrying";
        statusEl.style.color = "#fbbf24";
        setTimeout(connectWs, 2000);
      };
    }

    connectWs();

    // Render loop
    function render() {
      // Trail fade effect
      ctx.fillStyle = "rgba(3, 7, 18, 0.35)";
      ctx.fillRect(0, 0, width, height);

      // Render ripples
      for (let i = particles.length - 1; i >= 0; i--) {
        const r = particles[i];
        r.update();
        r.draw(ctx);
        if (r.alpha <= 0) particles.splice(i, 1);
      }

      // Render Lidar scan points
      ctx.fillStyle = "#38bdf8";
      for (let i = 0; i < latestPoints.length; i++) {
        const p = latestPoints[i];
        if (!p.distance) continue;

        const a = (p.angle + cal.rot) * (Math.PI / 180);
        const x = cal.x + cal.flip * Math.sin(a) * p.distance * cal.scale;
        const y = cal.y + Math.cos(a) * p.distance * cal.scale;

        if (x >= 0 && x <= width && y >= 0 && y <= height) {
          ctx.beginPath();
          ctx.arc(x, y, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // FPS Calculation
      frameCount++;
      const now = performance.now();
      if (now - lastFpsTime >= 1000) {
        fpsEl.textContent = frameCount;
        frameCount = 0;
        lastFpsTime = now;
      }

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
