<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Display</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #000000;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: background-color 0.4s ease;
    }
    .container {
      text-align: center;
      padding: 40px;
      background: rgba(10, 15, 25, 0.65);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 54px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
    }
    p {
      margin: 6px 0;
      font-size: 24px;
      color: #cbd5e1;
    }
    .badge {
      display: inline-block;
      margin-top: 15px;
      padding: 8px 18px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.2);
      font-weight: 600;
      font-size: 18px;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="tvTitle">TV DISPLAY</h1>
    <p id="colorLabel">Color: Standby</p>
    <div id="statusBadge" class="badge">Connected to Table</div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const tvId = params.get('tv') || '1';
    document.getElementById('tvTitle').textContent = `ROOM TV ${tvId}`;

    const wsUrl = `ws://${location.host}/ws/tv/${tvId}`;
    let socket = null;

    function applyColor(hex, name) {
      document.body.style.backgroundColor = hex;
      document.getElementById('colorLabel').textContent = `Color: ${name || hex}`;
    }

    if (params.get('color')) {
      applyColor(params.get('color'), params.get('name') || params.get('color'));
    }

    function connect() {
      socket = new WebSocket(wsUrl);
      socket.onopen = () => {
        document.getElementById('statusBadge').textContent = 'Live Synced to Table';
        document.getElementById('statusBadge').style.background = 'rgba(34, 197, 94, 0.3)';
      };
      socket.onmessage = (e) => {
        try {
          const data = JSON.parse(e.data);
          if (data.color) {
            applyColor(data.color, data.name);
          }
        } catch (err) {
          console.error(err);
        }
      };
      socket.onclose = () => {
        document.getElementById('statusBadge').textContent = 'Reconnecting...';
        document.getElementById('statusBadge').style.background = 'rgba(239, 68, 68, 0.3)';
        setTimeout(connect, 2000);
      };
    }
    connect();
  </script>
</body>
</html>
