<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="1600" height="1240"><rect width="800" height="620" rx="28" fill="#151920"/><rect x="40" y="34" width="188" height="34" rx="17" fill="#5ad1ff" fill-opacity="0.16"/><text letter-spacing="1.5" x="54" y="58" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#5ad1ff" text-anchor="start">TRAFFIC VIEW</text><text x="40" y="118" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#e9ecef" text-anchor="start">Put an object on a street</text><g transform="translate(0 110)"><clipPath id="c"><rect x="20" y="20" width="760" height="380"/></clipPath><g clip-path="url(#c)"><g stroke="#39414e" stroke-width="14" stroke-linecap="round" fill="none" transform="translate(0 0)"><path d="M 150 190 L 650 250"/><path d="M 180 400 L 640 360"/><path d="M 300 130 L 330 450"/><path d="M 520 140 L 480 450"/></g><path d="M 245 201 L 420 222" stroke="#ff3b5c" stroke-width="20" stroke-linecap="round" opacity="0.75"/><circle cx="332" cy="212" r="46" fill="#ff3b5c" fill-opacity="0.2" stroke="#ff3b5c" stroke-width="5"/><circle cx="332" cy="212" r="26" fill="#ffb020"/><text x="332" y="300" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#ff3b5c" text-anchor="middle">closed</text></g></g><line x1="40" y1="516" x2="760" y2="516" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/><text x="40" y="556" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="500" fill="#e9ecef" text-anchor="start">Anything that stands still for a second closes the street</text><text x="40" y="588" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="500" fill="#8a94a3" text-anchor="start">under it. Traffic finds another way. Lift it to reopen.</text></svg>
