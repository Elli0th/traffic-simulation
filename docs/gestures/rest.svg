<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="1600" height="1240"><rect width="800" height="620" rx="28" fill="#151920"/><rect x="40" y="34" width="202" height="34" rx="17" fill="#ff3b5c" fill-opacity="0.16"/><text letter-spacing="1.5" x="54" y="58" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ff3b5c" text-anchor="start">OUTBREAK GAME</text><text x="40" y="118" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#e9ecef" text-anchor="start">Resting hand or arm</text><g transform="translate(0 110)"><clipPath id="c"><rect x="20" y="20" width="760" height="380"/></clipPath><g clip-path="url(#c)"><g opacity="0.55"><rect x="150" y="262" width="330" height="96" rx="48" fill="#f1f3f5" transform="rotate(-12 315 310)"/></g><circle cx="600" cy="170" r="46" fill="none" stroke="#8a94a3" stroke-width="8"/><line x1="568" y1="202" x2="632" y2="138" stroke="#8a94a3" stroke-width="8" stroke-linecap="round"/><text x="600" y="252" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#8a94a3" text-anchor="middle">nothing happens</text></g></g><line x1="40" y1="516" x2="760" y2="516" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/><text x="40" y="556" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="500" fill="#e9ecef" text-anchor="start">Anything wider than a few fingers is ignored,</text><text x="40" y="588" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="500" fill="#8a94a3" text-anchor="start">so leaning on the table presses nothing.</text></svg>
