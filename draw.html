<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tangible Table · Light painting</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', sans-serif;
        color: #e9ecef;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: crosshair;
      }
      #hint {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        margin: 0;
        font-size: 5vw;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: rgba(255, 255, 255, 0.55);
        pointer-events: none;
        transition: opacity 1.2s;
      }
      #hint.off {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <canvas id="paint"></canvas>
    <p id="hint">Draw with your hands</p>
    <script type="module" src="/src/draw/main.js"></script>
  </body>
</html>
